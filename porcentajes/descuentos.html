<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos con Descuentos</title>
</head>
<body>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
        }

        .container{
            width: 100%;
            height: 100px;
            padding: 25vh;
            display: grid;
            place-items: center;
        }

        .form-container{
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 300px;
            justify-content: space-between;
            gap: 30px;
            border-radius: 10px;
        }

        input{
            padding: 6px 10px;
        }

        button{
            font-size: 15px;
        }
    </style>


    <div class="container">

        <div class="form-container">
    <label for="price"> Precio Original del Producto: </label>
    <input id="price" type="number"/>

    <label for="discount"> Descuento de tu Producto: </label>
    <input id="discount" type="number"/>

     
    <button id="calculate"> Calcular Descuento </button>
    <p id="result"></p>

        </div>

    </div>

    <script src="./descuentos.js"></script>

    
</body>
</html>
